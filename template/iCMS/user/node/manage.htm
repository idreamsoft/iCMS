
<button i="cms:UserNode:add" title="添加分类" type="button" class="btn btn-sm btn-alt-primary">
    <i class="fa fa-plus"></i>
    添加分类
</button>
<table class="table table-vcenter">
    <thead>
        <tr>
            <th class="text-center" style="width: 50px">#</th>
            <th>名称</th>
            <th class="d-none d-sm-table-cell">统计</th>
            <th class="text-center" style="width: 100px">权限</th>
            <th class="text-center" style="width: 100px">操作</th>
        </tr>
    </thead>
    <tbody>
        <!--{iCMS:user:node loop="true" row="10" userid="$ME.id" appid="1"}-->
        <tr id="id<!--{$user_node.id}-->" data-id="<!--{$user_node.id}-->">
            <th class="text-center" scope="row"><!--{$user_node.id}--></th>
            <td class="fw-semibold fs-sm">
                <a href="<!--{$user_node.url}-->"><!--{$user_node.name}--></a>
                <small class="form-text text-muted">
                    <!--{$user_node.description}-->
                </small>
            </td>
            <td class="d-none d-sm-table-cell">
                <!--{$user_node.count}-->
            </td>
            <td class="text-center">
                <!--{$user_node.mode?"公开":"私有"}-->
            </td>
            <td class="text-center">
                <div class="btn-group btn-group-sm">
                    <a i="cms:UserNode:add" href="javascript:;" class="btn btn-light"><i class="fa fa-fw fa-pencil-alt"></i></a>
                    <a i="cms:UserNode:delete" href="javascript:;" class="btn btn-light"><i class="fa fa-fw fa-trash-alt"></i></a>
                </div>
            </td>
        </tr>
        <!--{/iCMS}-->
    </tbody>
</table>

<div i="cms:UserNode:addbox" class="cms-ui-disabled hide">
    <div class="row">
        <div class="col-sm-12 col-md-8">
            <form action="<!--{iCMS:route url='UserNode'}-->" method="post">
                <div class="form-group">
                    <input type="text" class="form-control" id="name" name="name" placeholder="请输入分类名称" value="" />
                </div>
                <div class="form-group">
                    <input type="text" class="form-control" id="description" name="description" placeholder="请输入分类简介" value="" />
                </div>
                <div class="form-group">
                    <select name="mode" class="form-control" placeholder="请选择分类权限">
                        <option value="0">私有</option>
                        <option value="1">公开</option>
                    </select>
                </div>
                <div class="form-text text-muted">
                    最多可建立<!--{$iCMS.CONFIG.user.node.max}-->个分类
                </div>
            </form>
        </div>
    </div>
</div>
