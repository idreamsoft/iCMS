<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
    <title><!--{$ME.nickname}-->的 <!--{$site.title}-->_ <!--{$site.seotitle}--></title>
    <meta name="keywords" content="<!--{$site.keywords}-->" />
    <meta name="description" content="<!--{$ME.nickname}-->的<!--{$site.title}-->" />
    <meta name="mobile-agent" content="format=html5;url=<!--{$ME.urls.home}-->" />
    <!--{iCMS:public:ui}-->
    <link rel="stylesheet" href="<!--{$site.urls.assets}-->/css/usercp.css" />
    <script>
        function avatar_upload(json, a) {
            a.src = json.data.avatar;
            console.log(json, a);
        }
    </script>
</head>

<body>
    <div id="page-container">
        <main id="main-container">
            <!--{include file="iCMS://user/top.htm"}-->
            <!-- Hero Content -->
            <!--{"1"|rand:"16"|as:"bgNum"}-->
            <div class="bg-primary-dark" style="background: url(<!--{$site.urls.assets}-->/img/bg/photo17.jpg) center center no-repeat; background-size: cover">
                <div class="content content-full overflow-hidden bg-black-25">
                    <div class="my-5 text-center">
                        <h1 class="display-3 text-white mb-2 animated fadeInDown" data-toggle="appear" data-class="animated fadeInDown"><!--{$site.title}--></h1>
                        <h2 class="display-5 fw-light text-white-75 animated fadeInDown" data-toggle="appear" data-class="animated fadeInDown"><!--{$site.seotitle}--></h2>
                    </div>
                </div>
            </div>
            <!-- END Hero Content -->
            <!-- Page Content -->
            <div class="content content-boxed">
                <div class="row bg-white py-4">
                    <div class="col-sm-4 col-xl-3">
                        <div class="block block-transparent">
                            <div class="block-content p-0">
                                <div class="block block-rounded block-link-shadow">
                                    <div class="block-content block-content-full text-center ">
                                        <div class="mb-3">
                                            <img class="img-avatar img-avatar96 rounded-circle" i="cms:ui:file:upload" data-success="avatar_upload" data-url="<!--{iCMS:route url='FilesUser/avatar'}-->" src="<!--{$ME.avatar}-->" alt="" />
                                            <p class="text-gray fs-sm">点击上传头像</p>
                                        </div>
                                        <div class="fs-5 mb-1">
                                            <span class="fw-semibold"><!--{$ME.nickname}--></span>
                                            <span class="badge bg-secondary ms-1 fw-lighter"><!--{$ME.role.name}--></span>
                                        </div>
                                        <div class="fs-sm text-muted"><!--{$ME.data.slogan|default:'这家伙太懒了,什么都没有留下!'}--></div>
                                    </div>
                                    <div class="border-top"></div>
                                    <div class="d-sm-none push pt-3">
                                        <div class="row gutters-tiny">
                                            <div class="col-12">
                                                <button type="button" class="btn btn-light btn-block" data-toggle="class-toggle" data-target=".js-menuList" data-class="d-none">
                                                    <i class="fa fa-fw fa-bars text-muted mr-1"></i>
                                                    菜单
                                                </button>
                                            </div>
                                            <!-- <div class="col-6 d-none">
                                                <button type="button" class="btn btn-light btn-block" data-toggle="class-toggle" data-target=".js-ecom-div-cart" data-class="d-none">
                                                    <i class="fa fa-fw fa-shopping-cart text-muted mr-1"></i>
                                                    Cart (3)
                                                </button>
                                            </div> -->
                                        </div>
                                    </div>
                                    <div class="block-content js-menuList d-none d-sm-block" i="cms:user:usercp:menu">
                                        <!--{include file="iCMS://user/usercp/menu.htm"}-->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-8 col-xl-9">
                        <div class="block block-transparent">
                            <nav class="mb-1" aria-label="breadcrumb">
                                <ol class="breadcrumb breadcrumb-alt">
                                    <li class="breadcrumb-item"><a href="<!--{$site.url}-->">首页</a></li>
                                    <!--{foreach value="crumb" from="$breadcrumb"}-->
                                    <li class="breadcrumb-item"><a href="<!--{iCMS:route url='$crumb.url'}-->"><!--{$crumb.caption}--></a></li>
                                    <!--{/foreach}-->
                                </ol>
                            </nav>
                            <div class="block-header block-header-default">
                                <h3 class="block-title">
                                    <i class="fa fa-<!--{$menu.icon}--> text-muted mr-1"></i>
                                    <!--{$menu.caption}-->
                                </h3>
                                <div class="block-options">
                                    <button type="button" class="btn-block-option" data-toggle="block-option" data-action="state_toggle" data-action-mode="demo">
                                        <i class="si si-refresh"></i>
                                    </button>
                                </div>
                            </div>      
                            <div class="block-content p-0">
                                <!--{if $menu.template}-->
                                <!--{include file="$menu.template"}-->
                                <!--{/if}-->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- END Page Content -->
        </main>
        <!-- END Main Container -->
    </div>
    <!-- END Page Container -->
</body>

</html>
