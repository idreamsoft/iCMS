<div class="cms-favorite-dialog">
    <div class="block no-shadow mb-0">
        <div class="fs-sm text-muted text-center">请选择你想添加的收藏夹</div>
        <div class="block-content p-0">
            <div class="cms-favorite-list">
                <div class="list-group list-group-flush" i="cms:favorite:vlist">
                    <a href="javascript:;" class="list-group-item list-group-item-action d-flex justify-content-between align-items-start" :class="item.active" v-for="(item, index) in favoriteList" :key="item.id">
                        <div class="ms-2 me-auto">
                            <div class="fw-bold">
                                {{ item.title }}
                                <span v-if="item.mode" class="badge fw-normal border border-primary text-primary favorite-mode-1 ms-1">公开</span>
                                <span v-else class="badge fw-normal bg-light favorite-mode-0 ms-1">私有</span>
                            </div>
                            {{ item.follow }} 人关注 <span class="count">{{ item.count }}</span>条内容
                        </div>
                        <button type="button" :i="'cms:favorite:add'"
                        :data-fid="item.id" 
                        data-item-class=".list-group-item" 
                        data-item-count=".count" 
                        data-active-class="btn btn-sm btn-light" 
                        data-active-text="取消收藏" 
                        data-cancel-class="btn btn-sm btn-outline-primary" 
                        data-cancel-text="收藏" 
                        :class="['btn', 'btn-sm', item.active ? 'btn-light' : 'btn-outline-primary']">
                            {{ item.active ? '取消' : '' }}收藏
                        </button>
                    </a>
                </div>
            </div>
            <div class="mt-3">
                <button i="cms:favorite:dialog:create" type="button" class="btn btn-block btn-alt-primary">+ 创建收藏夹</button>
            </div>
        </div>
    </div>
</div>
