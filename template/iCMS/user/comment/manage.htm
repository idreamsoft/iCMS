<style>
    .comment_content {
        position: relative;
        line-height: 1.4;
        max-height: 120px;
        overflow: hidden;
    }

    .comment_content.showall {
        max-height: unset;
    }

    .comment_content .showall-btns {
        position: absolute;
        right: 0;
        bottom: 0px;
    }
</style>
<div id="comment-list" i="cms:comment:user:manage">
    <ul class="timeline timeline-alt">
        <!--{iCMS:comment:list loop="true" page="true" status=[1,3,4] row="5" userid="$ME.id"}-->
        <li class="timeline-event" data-id="<!--{$comment_list.id}-->" data-params="<!--{$comment_list.params|json}-->">
            <div class="timeline-event-icon bg-info fs-sm">
                <!--{$comment_list.apps.title}-->
            </div>
            <div class="timeline-event-block block" data-toggle="appear">
                <div class="block-header block-header-default">
                    <h3 class="block-title">
                        <a href="<!--{$comment_list.content_url}-->"><!--{$comment_list.target_title}--></a>
                    </h3>
                    <div class="block-options">
                        <div class="timeline-event-time block-options-item fs-sm fw-semibold"></div>
                        <a class="btn btn-alt-link btn-sm" href="<!--{$comment_list.content_url}-->" target="_blank">查看原文</a>
                    </div>
                </div>
                <div class="block-content p-1">
                    <!--{if $comment_list.status== "3" }-->
                    <span class="badge bg-warning"><!--{$comment_list.status_text}--></span>
                    <!--{/if}-->
                    <div class="comment_content border-bottom mb-2 p-2">
                        <!--{$comment_list.content}-->
                        <div class="showall-btns mb-2">
                            <a class="badge bg-gray-light text-gray-darker btn-showall" href="javascript:;">
                                <i class="fa fa-angles-down"></i> 展开全部
                            </a>
                        </div>
                    </div>
                    <span class="mr-2"><!--{$comment_list.create_time|date:'Y-m-d H:i:s')}--></span>
                    <span class="badge bg-gray-light text-gray-darker mr-2">
                        <i class="fa fa-fw fa-thumbs-up text-muted"></i>
                        <!--{$comment_list.up}-->
                    </span>
                    <span class="badge bg-gray-light text-gray-darker mr-2">
                        <i class="fa fa-fw fa-thumbs-down text-muted"></i>
                        <!--{$comment_list.down}-->
                    </span>
                    <!--{if $comment_list.reply_count}-->
                    <a class="badge bg-gray-light text-gray-darker mr-2" href="javascript:;">
                        <i class="fa fa-fw fa-comment-dots text-muted"></i>
                        <!--{$comment_list.reply_count}-->
                        条回复
                    </a>
                    <!--{/if}-->
                    <a i="cms:comment:user:delete" class="badge bg-gray-light text-gray-darker" href="javascript:;">
                        <i class="fa fa-fw fa-times text-muted"></i>删除
                    </a>
                </div>
                <!--{if $comment_list.reply_count}-->
                <div class="bg-gray-light p-2 fw-semibold"><!--{$comment_list.reply_count}-->条回复</div>
                <ul class="timeline timeline-alt">
                    <!--{iCMS:commentReply:list as="replyItem" status=[1,3,4] loop="true" comment_id="$comment_list.id" row="50"}-->
                    <li class="timeline-event" data-id="<!--{$replyItem.id}-->" data-params="<!--{$replyItem.params|json}-->">
                        <div class="timeline-event-icon">
                            <a href="<!--{$replyItem.user.url}-->" target="_blank" i="cms@h:user:ucard" data-userid="<!--{$replyItem.user.id}-->">
                                <img class="img-avatar img-avatar32" src="<!--{$replyItem.user.avatar}-->" />
                            </a>
                        </div>
                        <div class="timeline-event-block block" data-toggle="appear" style="margin-left: 30px;">
                            <div class="block-content p-1">
                                <!--{if $replyItem.status=="3"}-->
                                <span class="badge bg-warning"><!--{$replyItem.status_text}--></span>
                                <!--{/if}-->
                                <div class="comment_content border-bottom mb-2 p-2">
                                    <a href="<!--{$replyItem.user.url}-->" target="_blank" i="cms@h:user:ucard" data-userid="<!--{$replyItem.user.id}-->">
                                        <!--{$replyItem.user.name}-->
                                    </a>
                                    <!--{$replyItem.content}-->
                                    <div class="showall-btns mb-2">
                                        <a class="badge bg-gray-light text-gray-darker btn-showall" href="javascript:;">
                                            <i class="fa fa-angles-down"></i> 展开全部
                                        </a>
                                    </div>
                                </div>
                                <span class="mr-2"><!--{$replyItem.create_time|date:'Y-m-d H:i:s')}--></span>
                                <span class="badge bg-gray-light text-gray-darker mr-2">
                                    <i class="fa fa-fw fa-thumbs-up text-muted"></i>
                                    <!--{$replyItem.up}-->
                                </span>
                                <span class="badge bg-gray-light text-gray-darker mr-2">
                                    <i class="fa fa-fw fa-thumbs-down text-muted"></i>
                                    <!--{$replyItem.down}-->
                                </span>
                                <!--{if $replyItem.reply_count && 0}-->
                                <a class="badge bg-gray-light text-gray-darker mr-2" href="javascript:;">
                                    <i class="fa fa-fw fa-comment-dots text-muted"></i>
                                    <!--{$replyItem.reply_count}-->
                                    条回复
                                </a>
                                <!--{/if}-->
                                <a i="cms:comment:user:reply:delete" class="badge bg-gray-light text-gray-darker" href="javascript:;">
                                    <i class="fa fa-fw fa-times text-muted"></i>删除
                                </a>
                            </div>
                        </div>
                    </li>
                    <!--{/iCMS}-->
                </ul>
                <!--{/if}-->
            </div>
        </li>
        <!--{/iCMS}-->
    </ul>
    <nav aria-label="Page navigation">
        <ul class="pagination push">
            <!--{$iCMS.PAGE.NAV}-->
        </ul>
    </nav>
</div>
