<!DOCTYPE html>
<html>

<head>
    <title><!--{if $content.subtitle}--> <!--{$content.subtitle}-->_ <!--{/if}--> <!--{$content.title}-->_ <!--{$node.name}-->_ <!--{$site.title}-->_ <!--{$site.seotitle}--></title>
    <meta name="keywords" content="<!--{$content.keywords}-->" />
    <meta name="description" content="<!--{$content.description}-->" />
    <meta name="params" data-params="<!--{$content.params|json}-->" />
    <!--{iCMS:public:ui}-->

</head>

<body>
    <div id="page-container">
        <!-- Main Container -->
        <main id="main-container">
            <!--{include file="./widget/top.htm"}-->
            <!--{if $content.pic.url}-->
            <!-- Hero Content -->
            <div class="bg-secondary" style="background-image: url('<!--{$content.pic.url}-->')">
                <div class="bg-black-25">
                    <div class="content content-full overflow-hidden">
                        <div class="my-8 text-center">
                            <h1 class="text-white mb-2 invisible" data-toggle="appear" data-class="animated fadeInDown">
                                <!--{$content.title}-->
                            </h1>
                            <h2 class="h4 fw-light text-white-75 invisible" data-toggle="appear" data-class="animated fadeInDown">
                                <!--{$content.description}-->
                            </h2>
                        </div>
                    </div>
                </div>
            </div>
            <!-- END Hero Content -->
            <!--{/if}-->

            <div class="content content-boxed">
                <div class="row">
                    <div class="col-md-8 bg-white p-0">
                        <nav class="bg-light m-1 p-3" aria-label="breadcrumb">
                            <ol class="breadcrumb breadcrumb-alt">
                                <li class="breadcrumb-item">
                                    <a href="<!--{$site.url}-->">首页</a>
                                </li>
                                <!--{foreach value="breadcrumb" from="$node.navArray"}-->
                                <li class="breadcrumb-item">
                                    <a href="<!--{$breadcrumb.url}-->">
                                        <!--{$breadcrumb.name}-->
                                    </a>
                                </li>
                                <!--{/foreach}-->
                                <li class="breadcrumb-item active" aria-current="page">
                                    <!--{$content.link}-->
                                </li>
                            </ol>
                        </nav>
                        <h1 class="h1 text-center my-2 fw-semibold">
                            <!--{$content.title}-->
                        </h1>
                        <div class="text-center fs-sm">
                            <span class="d-inline-block py-2 px-4 bg-body-light rounded">
                                <a href="<!--{$node.url}-->"><!--{$node.name}--></a> ·
                                <a i="cms@h:user:ucard" data-userid="<!--{$content.user.id}-->" class="link-effect fw-semibold px-1" href="<!--{$content.user.url}-->">
                                    <!--{$content.user.name}-->
                                </a>
                                发布时间：
                                <!--{$content.pubdate|date:"Y-m-d H:i"}-->
                            </span>
                        </div>
                        <div class="content">
                            <!--{if $content.description}-->
                            <div class="fs-sm text-muted bg-body-light p-2 rounded">
                                <!--{$content.description}-->
                            </div>
                            <!--{/if}-->
                            <!--{if $content.tags_array}-->
                            <ol class="breadcrumb">
                                <li class="me-2"><i class="si si-tag"></i></li>
                                <!--{foreach value="tags" from="$content.tags_array"}-->
                                <li class="breadcrumb-item">
                                    <a href="<!--{$tags.url}-->"><!--{$tags.name}--></a>
                                </li>
                                <!--{/foreach}-->
                            </ol>
                            <!--{/if}-->
                        </div>
                        <div class="content content-boxed">
                            <!-- Story -->
                            <article class="story">
                                <div class="alert alert-info">以下为自定义应用的可调用内容，请自行调整</div>
                                <!--{if $content}-->
                                <table class="table table-hover table-striped table-vcenter fs-sm mb-0">
                                    <thead>
                                        <tr>
                                            <th style="width: 150px">字段名</th>
                                            <th>内容/数据结构</th>
                                            <th style="width: 200px">标签</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <!--{foreach key="key" value="value" from="$content"}-->
                                        <tr>
                                            <td><!--{$key}--></td>
                                            <td class="text-wrap text-break">
                                                <pre style="width: 100%;max-width: 360px; max-height: 300px; overflow: auto; background-color: #f8f9fa; padding: 10px; border-radius: 5px;">
                                                    <!--{$value|htmlencode|var_export}-->
                                                </pre>
                                                
                                            </td>
                                            <td class="text-wrap text-break">
                                                <!--{if is_array($value)}-->
                                                <!--{foreach key="k" value="v" from="$value"}-->
                                                &lt;!--{$content.<!--{$key}-->.<!--{$k}-->}--&gt;<br />
                                                <!--{/foreach}-->
                                                <!--{else}-->
                                                &lt;!--{$content.<!--{$key}-->}--&gt;
                                                <!--{/if}-->
                                            </td>
                                        </tr>
                                        <!--{/foreach}-->
                                    </tbody>
                                </table>
                                <!--{/if}-->
                            </article>
                            <!-- END Story -->

                            <nav class="d-flex justify-content-center" aria-label="Page navigation">
                                <ul class="pagination push">
                                    <!--{$content.page.nav}-->
                                </ul>
                            </nav>
                            <div class="d-flex justify-content-between mt-3">
                                <div class="prev">
                                    <b>上一篇:</b>
                                    <!--{iCMS:content:prev cid="$content.cid" id="$content.id"}-->
                                    <!--{if $content_prev}-->
                                    <a href="<!--{$content_prev.url}-->" class="prev" target="_self">
                                        <!--{$content_prev.title}-->
                                    </a>
                                    <!--{else}-->
                                    没有了
                                    <!--{/if}-->
                                </div>
                                <div class="next">
                                    <!--{iCMS:content:next cid="$content.cid" id="$content.id"}-->
                                    <!--{if $content_next}-->
                                    <a href="<!--{$content_next.url}-->" class="next" target="_self">
                                        <!--{$content_next.title}-->
                                    </a>
                                    <!--{else}-->
                                    没有了
                                    <!--{/if}-->
                                    <b>:下一篇</b>
                                </div>
                            </div>
                            <!-- Actions -->
                            <!--{include file="./widget/actions.htm" item="$content"}-->

                            <div class="block block-rounded">
                                <div class="block-header block-header-default">
                                    <h3 class="block-title">评论</h3>
                                </div>
                                <div class="block-content block-content-full">
                                    <div class="cms-comment-list hide">
                                        <!--{iCMS:comment:list loop="true" page="true" row="30" 
                                                iid="$content.id" 
                                                appid="$content.appid"
                                        }-->
                                            <!--{include file="iCMS://comment/list.item.htm" 
                                                author="$content.user" 
                                                replyRow="3"
                                            }-->
                                        <!--{/iCMS}-->
                                        <nav aria-label="Page navigation">
                                            <ul class="pagination push">
                                                <!--{$iCMS.PAGE.NAV}-->
                                            </ul>
                                        </nav>
                                    </div>
                                    <!--{iCMS:comment:vlist}-->
                                    <!--{iCMS:comment:form}-->
                                </div>
                            </div>
                            <!-- Section Content -->
                            <div class="block block-no-shadow">
                                <div class="block-header block-header-default">
                                    <h3 class="block-title">相关文章</h3>
                                </div>
                                <div class="block-content block-content-full">
                                    <div class="row">
                                        <!--{iCMS:content:list loop="true" node_id="$content.node_id" row="6"}-->
                                        <div class="col-md-4">
                                            <a class="block block-bordered block-rounded block-link-pop" href="<!--{$content_list.url}-->">
                                                <div class="block-content bg-secondary" style="max-height: 110px; background-image: url('<!--{$content_list.pic.url}-->')">
                                                    <h4 class="text-white mt-5 push">
                                                        <!--{$content_list.title}-->
                                                    </h4>
                                                </div>
                                                <div class="block-content block-content-full fs-sm">
                                                    <span class="text-primary mr-1">
                                                        <!--{$content_list.user.name}-->
                                                    </span>
                                                    <span><!--{$content_list.pubdate|date:"Y-m-d H:i"}--></span>
                                                </div>
                                            </a>
                                        </div>
                                        <!--{/iCMS}-->
                                    </div>
                                </div>
                            </div>
                            <!-- END Section Content -->
                        </div>
                    </div>
                    <div class="col-md-4 mt-2 mt-md-0">
                        <!--{include file="./right.author.htm" userid="$content.userid"}-->
                        <!--{iCMS:content:list row="10" cid="$node.id"}-->
                        <!--{include file="./right.hots.htm" hotsList="$content_list"}-->
                        <!--{include file="./right.comments.htm"}-->
                        <!--{include file="./right.social.htm"}-->
                    </div>
                </div>
            </div>
            <!-- More Stories -->

            <!-- END More Stories -->
            <!--{include file="./widget/footer.htm"}-->
            <script src="<!--{$content.hits.script}-->"></script>
        </main>
        <!-- END Main Container -->
    </div>
</body>

</html>
