<header class="bg-white-70 border-bottom shadow-sm sticky-top">

            <div class="d-flex justify-content-between align-items-center w-100">
                <!-- Brand/Logo Section -->
                <div class="navbar-brand-wrapper">
                    <a class="navbar-brand fw-bold display-5 text-primary text-decoration-none mb-0" href="<!--{$site.url}-->">
                        <img src="/assets/img/iCMS.png" alt="iCMS" style="height: 35px;">
                    </a>
                </div>

                <!-- Right Section: Search + User Actions -->
                <div class="d-flex align-items-center gap-2">
