<!DOCTYPE html>
<html>

<head>
    <title><!--{if $article.chapter && $article.subtitle}--> <!--{$article.subtitle}-->_ <!--{/if}--> <!--{$article.title}-->_ <!--{$node.name}-->_ <!--{$site.title}-->_ <!--{$site.seotitle}--></title>
    <meta name="keywords" content="<!--{$article.keywords}-->" />
    <meta name="description" content="<!--{$article.description}-->" />
    <meta name="params" data-params="<!--{$article.params|json}-->" />
    <!--{iCMS:public:ui}-->
</head>

<body>
    <div id="page-container">
        <!-- Main Container -->
        <main id="main-container">
            <!--{include file="./widget/top.htm"}-->
            <!--{if $article.pic.url}-->
            <!-- Hero Content -->
            <div class="bg-secondary" style="background-image: url('<!--{$article.pic.url}-->')">
                <div class="bg-black-25">
                    <div class="content content-full overflow-hidden">
                        <div class="my-8 text-center">
                            <h1 class="text-white mb-2 invisible" data-toggle="appear" data-class="animated fadeInDown">
                                <!--{$article.title}-->
                            </h1>
                            <h2 class="h4 fw-light text-white-75 invisible" data-toggle="appear" data-class="animated fadeInDown">
                                <!--{$article.description}-->
                            </h2>
                        </div>
                    </div>
                </div>
            </div>
            <!-- END Hero Content -->
            <!--{/if}-->
            <!--{include file="./widget/nav.htm"}-->
            <div class="content content-boxed mb-3">
                <div class="row">
                    <div class="col-md-8 bg-white p-0 rounded">
                        <nav class="m-1 p-3" aria-label="breadcrumb">
                            <ol class="breadcrumb breadcrumb-alt">
                                <li class="breadcrumb-item">
                                    <a href="<!--{$site.url}-->">首页</a>
                                </li>
                                <!--{foreach value="breadcrumb" from="$node.navArray"}-->
                                <li class="breadcrumb-item">
                                    <a href="<!--{$breadcrumb.url}-->">
                                        <!--{$breadcrumb.name}-->
                                    </a>
                                </li>
                                <!--{/foreach}-->
                                <li class="breadcrumb-item active" aria-current="page">
                                    <!--{$article.link}-->
                                </li>
                            </ol>
                        </nav>
                        <h1 class="h1 text-center my-4 fw-semibold">
                            <!--{$article.title}-->
                        </h1>
                        <div class="text-center fs-sm">
                            <span class="d-inline-block py-2 px-4 bg-body-light rounded">
                                <a href="<!--{$node.url}-->"><!--{$node.name}--></a> ·
                                <a i="cms@h:user:ucard" data-userid="<!--{$article.user.id}-->" class="link-effect fw-semibold px-1" href="<!--{$article.user.url}-->">
                                    <!--{$article.user.name}-->
                                </a>
                                发布时间：
                                <!--{$article.pubdate|date:"Y-m-d H:i"}-->
                            </span>                            
                        </div> 
                        <div class="content">
                            <!--{if $article.gallery}-->
                            <div i="cms:ui:slider" class="hide slick-nav-black slick-dotted-inner slick-dotted-white" data-dots="true" data-arrows="true" data-slides-to-show="3" data-center-mode="true" data-autoplay="true" data-autoplay-speed="3000">
                                <!--{foreach value="gallery" from="$article.gallery"}-->
                                <div>
                                    <img class="img-fluid" src="<!--{$gallery.url}-->" alt="" style="height: 300px;">
                                </div>
                                <!--{/foreach}-->
                            </div>
                            <!--{/if}-->

                            <!--{if $article.description}-->
                            <div class="fs-sm text-muted bg-body-light p-3">
                                <!--{$article.description}-->
                            </div>
                            <!--{/if}-->
                            <!--{if $article.tags_array}-->
                            <ol class="breadcrumb">
                                <li class="me-2"><i class="si si-tag"></i></li>
                                <!--{foreach value="tags" from="$article.tags_array"}-->
                                <li class="breadcrumb-item">
                                    <a href="<!--{$tags.url}-->"><!--{$tags.name}--></a>
                                </li>
                                <!--{/foreach}-->
                            </ol>
                            <!--{/if}-->
                        </div>
                        <div class="content content-boxed">
                            <!-- Story -->
                            <!--{if $article.markdown}-->
                            <link rel="stylesheet" href="/assets/css/markdown.css" />
                            <!--{/if}-->
                            <article class="article <!--{$article.markdown ? 'markdown-body':''}-->">
                                <!--{$article.body}-->
                            </article>
                            <!-- END Story -->

                            <nav class="d-flex justify-content-center" aria-label="Page navigation">
                                <!--{if $article.chapter}-->
                                <div class="chapterlist">
                                    <h3>内容导航</h3>
                                    <ul>
                                        <!--{foreach value="pagelist" from="$article.page.list"}-->
                                        <li>
                                            第<!--{$pagelist.pn}-->章：
                                            <a href="<!--{$pagelist.url}-->" title="<!--{$pagelist.title}-->">
                                                <!--{if $pagelist.title}-->
                                                <!--{$pagelist.title|default:'下一页更精彩'}-->
                                                <!--{else}-->
                                                第<!--{$pagelist.pn}-->章
                                                <!--{/if}-->
                                            </a>
                                        </li>
                                        <!--{/foreach}-->
                                    </ul>
                                    <div class="clearfix"></div>
                                </div>
                                <!--{else}-->
                                <ul class="pagination push">
                                    <!--{$article.page.nav}-->
                                </ul>
                                <!--{/if}-->
                            </nav>
                            <div class="d-flex justify-content-between mt-3">
                                <div class="prev" style="width: 45%;">
                                    <b>上一篇:</b>
                                    <!--{iCMS:article:prev cid="$article.cid" id="$article.id"}-->
                                    <!--{if $article_prev}-->
                                    <a href="<!--{$article_prev.url}-->" class="prev" target="_self">
                                        <!--{$article_prev.title}-->
                                    </a>
                                    <!--{else}-->
                                    没有了
                                    <!--{/if}-->
                                </div>
                                <div class="next" style="width: 45%;text-align: right;">
                                    <!--{iCMS:article:next cid="$article.cid" id="$article.id"}-->
                                    <!--{if $article_next}-->
                                    <a href="<!--{$article_next.url}-->" class="next" target="_self">
                                        <!--{$article_next.title}-->
                                    </a>
                                    <!--{else}-->
                                    没有了
                                    <!--{/if}-->
                                    <b>:下一篇</b>
                                </div>
                            </div>
                            <!-- Actions -->
                            <!--{include file="./widget/actions.htm" item="$article"}-->



                        </div>
                        <div class="block block-no-shadow border-top border-bottom mb-0">
                            <div class="block-header block-header-default">
                                <h3 class="block-title">评论</h3>
                            </div>
                            <div class="block-content block-content-full">
                                <!--{iCMS:comment:vlist}-->
                                <!--{iCMS:comment:form}-->
                            </div>
                        </div>
                        <!-- Section Content -->
                        <div class="block block-no-shadow">
                            <div class="block-header block-header-default">
                                <h3 class="block-title">相关文章</h3>
                            </div>
                            <div class="block-content block-content-full">
                                <div class="row">
                                    <!--{iCMS:article:list loop="true" node_id="$article.node_id" row="9" pic="true"}-->
                                    <div class="col-6 col-sm-4 col-md-6 col-lg-4">
                                        <a class="block block-rounded block-link-pop" href="<!--{$article_list.url}-->">
                                            <div class="block-content p-2  fs-sm">
                                                <div class="ratio ratio-4x3 mb-2">
                                                    <img class="w-100 h-100 lazyload border rounded p-2" src="/assets/img/loading-b.svg" data-src="<!--{$article_list.pic.url}-->" alt="<!--{$article_list.title}-->" loading="lazy" decoding="async" style="object-fit: cover;">
                                                </div>
                                                <b class="d-block h-6 overflow-hidden mt-1">
                                                    <!--{$article_list.title}-->
                                                </b>
                                                <div class="d-flex justify-content-between align-items-center overflow-hidden">
                                                    <span class="text-primary my-2"><!--{$article_list.user.name}--></span>
                                                    <span><!--{$article_list.pubdate|date:"Y-m-d"}--></span>
                                                </div>
                                            </div>
                                        </a>
                                    </div>
                                    <!--{/iCMS}-->
                                </div>
                            </div>
                        </div>
                        <!-- END Section Content -->
                    </div>
                    <div class="col-md-4 mt-2 mt-md-0">
                        <!--{include file="./right.author.htm" userid="$article.userid"}-->
                        <!--{iCMS:article:list row="10" cid="$node.id"}-->
                        <!--{include file="./right.hots.htm" hotsList="$article_list"}-->
                        <!--{include file="./right.comments.htm"}-->
                        <!--{include file="./right.social.htm"}-->
                    </div>
                </div>
            </div>
            <!-- More Stories -->

            <!-- END More Stories -->
            <!--{include file="./widget/footer.htm"}-->
            <script src="<!--{$article.hits.script}-->"></script>
        </main>
        <!-- END Main Container -->
    </div>
</body>

</html>
