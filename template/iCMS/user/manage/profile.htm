<form i="cms:user:profile" action="<!--{iCMS:route url='UserProfile'}-->" method="POST">
    <input type="hidden" name="action" value="save" />

    <div class="block">
        <div class="block-content p-0">
            <div class="form-group row">
                <label for="phone" class="col-sm-2 col-form-label text-sm-end">手机号</label>
                <div class="col-sm-8">
                    <fieldset class="form-control" disabled><!--{$ME.phone}--></fieldset>
                </div>
            </div>
            <div class="form-group row">
                <label for="account" class="col-sm-2 col-form-label text-sm-end">账号</label>
                <div class="col-sm-8">
                    <fieldset class="form-control" disabled><!--{$ME.account}--></fieldset>
                </div>
            </div>
            <div class="form-group row">
                <label for="email" class="col-sm-2 col-form-label text-sm-end">邮箱</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" id="email" name="email" value="<!--{$ME.email}-->" />
                </div>
            </div>
            <div class="form-group row">
                <label for="nickname" class="col-sm-2 col-form-label text-sm-end">昵称</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" id="nickname" name="nickname" value="<!--{$ME.nickname}-->" />
                </div>
            </div>
            <div class="form-group row">
                <label for="gender" class="col-sm-2 col-form-label text-sm-end">性别</label>
                <div class="col-sm-8 py-1">
                    <div class="form-check">
                        <input type="radio" class="form-check-input" name="gender" id="gender_0" value="0" i="cms:ui:checked" data-checked="<!--{$ME.gender}-->" />
                        <label class="form-check-label" for="gender_0">女</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" name="gender" id="gender_1" value="1" i="cms:ui:checked" data-checked="<!--{$ME.gender}-->" />
                        <label class="form-check-label" for="gender_1">男</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" name="gender" id="gender_2" value="2" i="cms:ui:checked" data-checked="<!--{$ME.gender}-->" />
                        <label class="form-check-label" for="gender_2">保密</label>
                    </div>
                </div>
            </div>
            <div class="form-group row">
                <label for="slogan" class="col-sm-2 col-form-label text-sm-end">我的签名</label>
                <div class="col-sm-8">
                    <textarea id="slogan" name="data[slogan]" rows="5" class="slogan form-control" placeholder="随便写点什么，让大家了解你吧。"><!--{$ME.data.slogan}--></textarea>
                </div>
            </div>
        </div>
        <div class="form-group row">
            <div class="col-sm-2"></div>
            <div class="col-sm-6">
                <button type="submit" class="btn btn-alt-primary">修改账号信息</button>
            </div>
        </div>
    </div>
    <div class="block">
        <div class="block-header block-header-default">
            <h3 class="block-title">个人信息</h3>
        </div>
        <div class="block-content px-0">
            <div class="form-group row">
                <label for="weixin" class="col-sm-2 col-form-label text-sm-end">微信</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" id="weixin" name="data[weixin]" value="<!--{$ME.data.weixin}-->" />
                </div>
            </div>
            <div class="form-group row">
                <label for="weibo" class="col-sm-2 col-form-label text-sm-end">微博</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" id="weibo" name="data[weibo]" value="<!--{$ME.data.weibo}-->" />
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-2 col-form-label text-sm-end" for="city">省市区</label>
                <div class="col-sm-8">
                    <input type="text" name="data[city]" class="form-control" i="cms:ui:citypicker" id="city" value="<!--{$ME.data.city}-->" />
                </div>
            </div>

            <div class="form-group row">
                <label for="birthday" class="col-sm-2 col-form-label text-sm-end">生日</label>
                <div class="col-sm-8">
                    <input type="text" id="birthday" name="data[birthday]" class="form-control" i="cms:ui:datepicker" value="<!--{$ME.data.year}-->-<!--{$ME.data.month}-->-<!--{$ME.data.day}-->">
                </div>
            </div>
            <div class="form-group row">
                <label for="constellation" class="col-sm-2 col-form-label text-sm-end">星座</label>
                <div class="col-sm-8">
                    <select id="constellation" name="data[constellation]" class="form-control" placeholder="星座" i="cms:ui:bs-selectpicker" value="<!--{$ME.data.constellation}-->">
                        <option value="白羊座">白羊座 3.21-4.19</option>
                        <option value="金牛座">金牛座 4.20-5.20</option>
                        <option value="双子座">双子座 5.21-6.21</option>
                        <option value="巨蟹座">巨蟹座 6.22-7.22</option>
                        <option value="狮子座">狮子座 7.23-8.22</option>
                        <option value="处女座">处女座 8.23-9.22</option>
                        <option value="天秤座">天秤座 9.23-10.23</option>
                        <option value="天蝎座">天蝎座 10.24-11.22</option>
                        <option value="射手座">射手座 11.23-12.21</option>
                        <option value="魔羯座">魔羯座 12.22-1.19</option>
                        <option value="水瓶座">水瓶座 1.20-2.18</option>
                        <option value="双鱼座">双鱼座 2.19-3.20</option>

                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label for="profession" class="col-sm-2 col-form-label text-sm-end">职业</label>
                <div class="col-sm-8">
                    <select id="profession" name="data[profession]" class="form-control" placeholder="职业" i="cms:ui:bs-selectpicker" value="<!--{$ME.data.profession}-->">
                        <option value="白领">白领</option>
                        <option value="学生">学生</option>
                        <option value="工人">工人</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label for="personstyle" class="col-sm-2 col-form-label text-sm-end">个人标签</label>
                <div class="col-sm-8">
                    <input i="cms:user:manage:personstyle" type="text" class="form-control" id="personstyle" name="data[personstyle]" value="<!--{$ME.data.personstyle}-->" />
                </div>
            </div>
        </div>
        <div class="form-group row">
            <div class="col-sm-2"></div>
            <div class="col-sm-6">
                <button type="submit" class="btn btn-alt-primary">修改个人信息</button>
            </div>
        </div>
    </div>
    <div class="block">
        <div class="block-header block-header-default">
            <h3 class="block-title">隐私设置</h3>
        </div>
        <div class="block-content px-0">
            <div class="form-group row">
                <label for="message_receive_all" class="col-sm-2 col-form-label text-sm-end">私信</label>
                <div class="col-sm-8 py-1">
                    <div class="form-check">
                        <input type="radio" class="form-check-input" name="setting[message][receive]" id="message_receive_all" value="all" i="cms:ui:checked" data-checked="<!--{$ME.setting.message.receive|default:'all'}-->" />
                        <label class="form-check-label" for="message_receive_all">允许所有人给我发私信</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" name="setting[message][receive]" id="message_receive_follow" value="follow" i="cms:ui:checked" data-checked="<!--{$ME.setting.message.receive|default:'all'}-->" />
                        <label class="form-check-label" for="message_receive_follow">只允许我关注的人给我发私信</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" name="setting[message][receive]" id="message_receive_0" value="0" i="cms:ui:checked" data-checked="<!--{$ME.setting.message.receive|default:'all'}-->" />
                        <label class="form-check-label" for="message_receive_0">关闭私信</label>
                    </div>
                </div>
            </div>
        </div>
        <div class="form-group row">
            <div class="col-sm-2"></div>
            <div class="col-sm-6">
                <button type="submit" class="btn btn-alt-primary">修改隐私设置</button>
            </div>
        </div>
    </div>
</form>
<div class="block">
    <div class="block-header block-header-default">
        <h3 class="block-title">社交账号绑定</h3>
    </div>
    <div class="block-content px-0">

                <a class="btn btn-primary" href="">马上绑定</a>

            </div>
        </div>
        <!--{/if}-->
        <!--{if $user_social.weibo.enable }-->
        <div class="form-group row">
            <label for="personstyle" class="col-sm-2 col-form-label text-sm-end">微博</label>
            <div class="col-sm-8 py-1">
                <a href="<!--{iCMS:route url='user/login/weibo'}-->" class="btn btn-link">
                    <svg fill="#fb6622" viewBox="0 0 24 24" width="30" height="30">

                <a class="btn btn-alt-primary" href="">已绑定,取消绑定</a>

            </div>
        </div>
        <!--{/if}-->
    </div>
</div>
