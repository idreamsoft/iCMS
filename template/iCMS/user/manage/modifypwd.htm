<form i="cms:user:manage:modifypwd" action="<!--{iCMS:route url='UserProfile'}-->" method="POST">
    <input type="hidden" name="action" value="modifypwd" />
    <div class="block" style="max-width: 360px">
        <div class="block-content p-0">
            <div class="form-group row">
                <label class="col-sm-3 col-form-label text-sm-end" for="password">原密码</label>
                <div class="col-sm-8">
                    <input type="password" class="form-control" id="password" name="password" value="" />
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-3 col-form-label text-sm-end" for="pwd">新密码</label>
                <div class="col-sm-8">
                    <input type="password" class="form-control" id="passwd" name="passwd" value="" />
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-3 col-form-label text-sm-end" for="pwd">确认新密码</label>
                <div class="col-sm-8">
                    <input type="password" class="form-control" id="passwd-confirm" name="passwd-confirm" value="" />
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-3 col-form-label text-sm-end" for="captcha">图形验证码</label>
                <div class="col-sm-8">
                    <div class="input-group">
                        <input type="text" maxlength="4" class="form-control" id="captcha" name="captcha" placeholder="图形验证码" />
                        <div class="input-group-append">
                            <!--{iCMS:public:captcha class="rounded-right"}-->
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-group row">
                <div class="col-sm-2"></div>
                <div class="col-sm-6">
                    <button type="submit" class="btn btn-alt-primary">修改密码</button>
                </div>
            </div>
        </div>
    </div>
</form>
