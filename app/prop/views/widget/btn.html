<a class="<?php echo $class; ?> " i="cms:ui:modal" href="{{prop/add}}?_app=<?php echo $app; ?>&field=<?php echo $field; ?>" data-params='{"width":"60%","height":"600px"}' title="<?php echo $title; ?>">
    <?php echo $text; ?>
</a>
<?php if (!$GLOBALS['PROP.CALLBACK'][$field]) { ?>
<script>
    function <?php echo $field; ?>PropCallback(field, data) {
        var el = $("#" + field);
        var name = el.prop("tagName");
        // console.log(el, name);
        if (name == 'INPUT') {
            el.val(data.val);
            $('.itemList', el.parent()).before('<a class="dropdown-item" href="javascript:;" data-mode="true" data-target="#' + data.field + '" i="cms:ui:insert" data-insert="' + data.val + '">' + data.name + '</a>')
        } else if (name == 'SELECT') {
            el.append('<option value="' + data.val + '">' + data.name + ' [' + data.field + '="' + data.val + '"]</option>');
            el.trigger("chosen:updated");
        }
    }
</script>
<?php
    $GLOBALS['PROP.CALLBACK'][$field] = 1;
} ?>
