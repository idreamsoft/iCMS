<div i="reply:item" class="cms-comment-reply-item">
    <div class="cms-comment-reply-avatar">
        <a href="<!--{$replyItem.user.url}-->" target="_blank" i="cms@h:user:ucard" data-userid="<!--{$replyItem.user.id}-->">
            <img src="<!--{$replyItem.user.avatar}-->" />
        </a>
    </div>
    <div class="cms-comment-reply-body">
        <div class="cms-comment-reply-user">
            <a href="<!--{$replyItem.user.url}-->" target="_blank" i="cms@h:user:ucard" data-userid="<!--{$replyItem.user.id}-->">
                <!--{$replyItem.user.name}-->
            </a>
            <!--{if $replyItem.user.id==$ME.id}-->
            <span class="cms-comment-badge cms-comment-badge-me">我</span>
            <!--{/if}-->
            <!--{if $replyItem.user.id==$author.uid}-->
            <span class="cms-comment-badge cms-comment-badge-author">作者</span>
            <!--{/if}-->
            <!--{if $replyItem.reply_user.id}-->
            <span class="cms-comment-reply-text"></span>
            <a href="<!--{$replyItem.reply_user.url}-->" target="_blank" i="cms@h:user:ucard" data-userid="<!--{$replyItem.reply_user.id}-->">
                <!--{$replyItem.reply_user.name}-->
            </a>
            <!--{if $replyItem.reply_user.id==$ME.id}-->
            <span class="cms-comment-badge cms-comment-badge-me">我</span>
            <!--{/if}-->
            <!--{if $replyItem.reply_user.id==$author.uid}-->
            <span class="cms-comment-badge cms-comment-badge-author">作者</span>
            <!--{/if}-->
            <!--{/if}-->
            <span class="cms-comment-badge cms-comment-badge-floor"><!--{$replyItem.lou}-->楼</span>
        </div>
        <div class="cms-comment-reply-inner">
            <p><!--{$replyItem.content}--></p>
        </div>
        <div class="cms-comment-reply-foot">
            <em>
                <!--{$replyItem.update_time|format_date}-->
            </em>
            <div class="cms-comment-reply-foot-btns">
                <a i="cms:comment:reply:reply">
                    <i class="fa fa-fw fa-comment"></i> 回复
                </a>
                <a i="cms:comment:reply:like" class="<!--{$replyItem.is_up?'active':''}-->">
                    <i class="fa fa-fw fa-heart"></i> <!--{$replyItem.up}-->
                </a>
            </div>
        </div>
        <div i="reply2:form" class="my-2"></div>
    </div>
</div>
