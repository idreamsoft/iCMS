<div class="cms-comment-wrapper">
    <div class="my-2">
        <!--{include file="iCMS://user/widget/status.htm"}-->
    </div>
    <!-- 评论表单 -->
    <form i="cms:comment:form" class="cms-comment-form <!--{$comment_vars.class}-->" action="<!--{iCMS:route url='comment'}-->" method="POST">
        <input type="hidden" name="action" value="add" />
        <input type="hidden" name="params" value="<!--{$comment_vars.params|json}-->" />
        <input type="hidden" name="sign" value="<!--{$comment_vars.sign}-->" />
        <div>
            <textarea name="content" type="text" class="cms-comment-form-content" placeholder="请输入您的评论"></textarea>
            <div class="cms-comment-form-actions">
                <!--{iCMS:comment:config}-->
                <!--{if $comment_config.captcha}-->
                <div class="cms-comment-form-captcha">
                    <input type="text" maxlength="4" data-name="comment" name="captcha" placeholder="请输入验证码" />
                    <!--{iCMS:public:captcha name="comment"}-->
                </div>
                <!--{/if}-->
                <button type="submit" class="cms-comment-form-submit">发布</button>
            </div>
        </div>
    </form>
</div>
