<!-- 菜单项组件模板 -->
<script type="text/x-template" id="menu-item-template">
    <div class="menu-item ml-2 mb-1 bg-white">
        <div 
            class="flex items-center p-1 mr-3 hover:bg-gray-50 transition-colors cursor-move"
            draggable="true"
            @dragstart="$emit('drag-start', $event, item, index, parent)"
            @dragend="$emit('drag-end')"
            @dragover.prevent="$emit('drag-over', $event)"
            @drop.prevent.stop="$emit('drop', $event, item, index, parent, false)"
        >
            <!-- 拖拽手柄 -->
            <div class="text-gray-400 mr-3 cursor-move">
                <i class="fas fa-grip-vertical"></i>
            </div>
            
            <!-- 展开/折叠按钮 -->
            <button 
                v-if="item.children && item.children.length > 0" 
                @click="$emit('toggle-expand', item)"
                class="text-gray-500 hover:text-gray-700 mr-2 w-4 h-4 flex items-center justify-center"
            >
                <i :class="item.expanded ? 'fas fa-chevron-down' : 'fas fa-chevron-right'"></i>
            </button>
            <div v-else class="w-6"></div>
            
            <!-- 图标 -->
            <div v-if="item.icon" class="mr-3 w-5 h-5 flex items-center justify-center">
                <i :class="[item.icon.includes(' ') ? item.icon : `fa fa-fw fa-${item.icon}`]" class="text-gray-600"></i>
            </div>
            
            <!-- 菜单名称 -->
            <div class="flex-1 relative">
                <div 
                    class="absolute inset-0 opacity-0 hover:opacity-100 transition-all duration-200 flex items-center justify-center bg-blue-100 border-2 border-blue-300 border-dashed"
                    @dragenter.prevent
                    @dragover.prevent
                    @drop.prevent.stop="$emit('drop', $event, item, index, parent, true)"
                    title="拖拽到此处作为子菜单"
                >
                    <span class="text-xs text-blue-600 font-medium">作为子菜单</span>
                </div>
                <span v-if="item.caption === '-'" class="text-gray-400 italic">-------------分隔线-----------</span>
                <span v-else-if="item.caption" class="text-gray-800 font-medium">{{ item.caption }}</span>
                <span v-else class="text-gray-800 font-medium">{{ item.id }}</span>
                <span v-if="item.href" class="text-sm text-gray-500">{{ item.href }}</span>
                
                <!-- 内部拖拽放置区域 -->
                <div 
                    class="absolute inset-y-0 right-0 left-1/2 opacity-0 hover:opacity-100 transition-all duration-200 flex items-center justify-center"
                    :class="{
                        'opacity-100 bg-blue-100 border-2 border-blue-300 border-dashed': isDragOver,
                        'pointer-events-auto': true
                    }"
                    @dragenter.prevent="isDragOver = true; $event.dataTransfer.dropEffect = 'copy'"
                    @dragover.prevent="$event.dataTransfer.dropEffect = 'copy'"
                    @dragleave.prevent="isDragOver = false"
                    @drop.prevent="isDragOver = false; $emit('drop', $event, item, index, parent, true)"
                    title="拖拽到此处作为子菜单"
                >
                    <span class="text-xs text-blue-600 font-medium">作为子菜单</span>
                </div>
            </div>
            
            <!-- 操作按钮 -->
            <div class="flex items-center gap-2">
                <button 
                    @click="$emit('add-child', item)"
                    class="text-blue-500 hover:text-blue-700 p-1 rounded transition-colors"
                    title="添加子菜单"
                >
                    <i class="fas fa-plus text-sm"></i>
                </button>
                <button 
                    @click="$emit('edit', item)"
                    class="text-green-500 hover:text-green-700 p-1 rounded transition-colors"
                    title="编辑"
                >
                    <i class="fas fa-edit text-sm"></i>
                </button>
                <button
                    @click="$emit('delete', item, parent)"
                    class="text-red-500 hover:text-red-700 p-1 rounded transition-colors"
                    title="删除"
                >
                    <i class="fas fa-trash text-sm"></i>
                </button>
            </div>
        </div>
        
        <!-- 子菜单 -->
        <div v-if="item.children && item.children.length > 0 && item.expanded" class="ml-2 border-l-2 border-gray-200 pl-4 pb-2">
            <menu-item 
                v-for="(child, childIndex) in item.children" 
                :key="child.id || childIndex"
                :item="child" 
                :index="childIndex"
                :parent="item"
                @edit="$emit('edit', $event)"
                @delete="(...args) => $emit('delete', ...args)"
                @add-child="$emit('add-child', $event)"
                @drag-start="(...args) => $emit('drag-start', ...args)"
                @drag-end="(...args) => $emit('drag-end', ...args)"
                @drag-over="(...args) => $emit('drag-over', ...args)"
                @drop="(...args) => $emit('drop', ...args)"
                @toggle-expand="$emit('toggle-expand', $event)"
            ></menu-item>
        </div>
    </div>
</script>
