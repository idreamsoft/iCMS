<form i="cms:ArticleUser:publish:form" action="<!--{iCMS:route url='ArticleUser'}-->" method="POST">
    <input name="action" type="hidden" value="save" />
    <input name="sign" type="hidden" value="<!--{$sign}-->" />
    <input name="once" type="hidden" value="<!--{$once}-->" />
    <input name="isMarkdown" type="hidden" value="<!--{$isMarkdown}-->" />
    <input name="id" type="hidden" value="<!--{$article.id}-->" />
    <div class="form-group row">
        <label class="col-sm-2 col-form-label text-sm-end" for="cid">栏 目</label>
        <div class="col-sm-8">
            <div class="input-group">
                <select name="cid" id="cid" class="form-control" i="cms:ui:bs-selectpicker" data-placeholder="== 请选择所属栏目 ==">
                    <option value="0">== 请选择所属栏目 ==</option>
                    <!--{iCMS:node:select selected="$article.cid" appid="1"}-->
                </select>
                <a class="btn btn-dark" href="<!--{iCMS:route url='UserNode/manage'}-->" i="cms:ui:modal" data-meta='{"width":"60%","height":"600px"}' title="添加栏目"><i class="fa fa-fw fa-plus"></i></a>
            </div>
        </div>
    </div>
    <div class="form-group row">
        <label class="col-sm-2 col-form-label text-sm-end" for="ucid">我的分类</label>
        <div class="col-sm-8">
            <div class="input-group">
                <select name="ucid" id="ucid" class="form-control" i="cms:ui:bs-selectpicker" value="<!--{$article.ucid}-->" data-placeholder="== 我的分类 ==">
                    <!--{iCMS:user:node loop="true" row="10" userid="$ME.id" appid="1" }-->
                    <option value="<!--{$user_node.id}-->"><!--{$user_node.name}--></option>
                    <!--{/iCMS}-->
                </select>
            </div>
        </div>
    </div>
    <div class="form-group row">
        <label class="col-sm-2 col-form-label text-sm-end" for="title">标 题</label>
        <div class="col-sm-8">
            <input type="text" name="title" class="form-control" id="title" value="<!--{$article.title}-->" />
        </div>
    </div>

    <div class="form-group row">
        <label class="col-sm-2 col-form-label text-sm-end" for="source">出处</label>
        <div class="col-sm-4 col-md-4 col-lg-3">
            <input type="text" name="source" class="form-control" id="source" value="<!--{$article.source}-->" />
        </div>
        <label class="col-sm-2 col-form-label text-sm-end" for="author">作者</label>
        <div class="col-sm-4 col-md-4 col-lg-3">
            <input type="text" name="author" class="form-control" id="author" value="<!--{$article.author}-->" />
        </div>
    </div>
    <div class="form-group row">
        <label class="col-sm-2 col-form-label text-sm-end" for="pic">封面</label>
        <div class="col-sm-8">
            <input type="text" name="pic" class="form-control" 
            i="cms:ui:file:btns"
            value="<!--{$article.pic}-->" 
            data-browse-width="50%"
            data-upload="true"
            data-browse="true" 
            data-preview="true" 
            />
        </div>
    </div>
    <div class="form-group row">
        <label class="col-sm-2 col-form-label text-sm-end" for="tags">标签</label>
        <div class="col-sm-8">
            <div class="input-group">
                <input type="text" name="tags" class="form-control" id="tags" value="<!--{$article.tags}-->" onkeyup="javascript:this.value=this.value.replace(/，/ig,',');" />
                <button class="btn btn-dark" id="tag_extrac" data-target="#tags" class="btn" type="button" title="智能提取标签"><i class="fa fa-fw fa-magic"></i></button>
            </div>
            <small class="form-text text-muted">多个标签用,分隔</small>
        </div>
    </div>
    <div class="form-group row">
        <label class="col-sm-2 col-form-label text-sm-end" for="description">摘 要</label>
        <div class="col-sm-8">
            <textarea name="description" id="description" class="form-control" style="height: 90px"><!--{$article.description}--></textarea>
        </div>
    </div>
    <div class="form-group">
        <div class="block-header block-header-default">
            <h3 class="block-title"><i class="far fa-bookmark text-muted mr-1"></i>内容</h3>
        </div>
        <div class="editor-container">
            <textarea type="text/plain" id="editor-body-1" i="cms:ui:editor" data-boot="usercp" name="body" data-widget="<!--{$editor}-->"><!--{$articleData.body}--></textarea>
        </div>
    </div>
    <!--{iCMS:user:config key="post" as="ucpost"}-->
    <!--{if $ucpost.captcha }-->
    <div class="form-group row">
        <label class="col-sm-2 col-form-label text-sm-end">验证码</label>
        <div class="col-sm-4">
            <div class="input-group input-group-sm">
                <input type="text" maxlength="4" class="form-control form-control-lg form-control-alt" id="captcha" name="captcha" placeholder="图形验证码" />
                <div class="input-group-text">
                    <!--{iCMS:public:captcha class="rounded-right"}-->
                </div>
            </div>
        </div>
    </div>
    <!--{/if}-->
    <div class="form-group row py-4 mt-4 bg-body-light">
        <label class="col-sm-2"></label>
        <div class="col-sm-8">
            <button type="submit" class="btn btn-lg btn-primary px-5 py-2" data-loading-text="提交中，请稍候...">
                <i class="fa fa-fw fa-check"></i>
                提 交
            </button>
        </div>
    </div>
</form>
