        .rainbow::before{
            content: '';
            filter: blur(calc(.8* 1rem));
            background-size: 200%;
            background-image: linear-gradient(90deg, hsl(var(--color-1)), hsl(var(--color-5)), hsl(var(--color-3)), hsl(var(--color-4)), hsl(var(--color-2)));
            animation: rainbow var(--speed,2s) infinite linear;
            --tw-translate-x: -50%;
            --tw-translate-y: 0;
            --tw-rotate: 0;
            --tw-skew-x: 0;
            --tw-skew-y: 0;
            --tw-scale-x: 1;
            --tw-scale-y: 1;
            --speed: 2s;
            transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));

            bottom: -20%;
            left: 50%;

            width: 100%;

        @keyframes rainbow {
            0% {
                content: '';
                background-position: 0
            }

            to {
                content: '';
                background-position: 200%
            }
        }
        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(180deg);
            }
        }

        @keyframes floatAndFade {
            0% {
                opacity: 0;
                transform: translateY(0px) rotate(0deg) scale(0.5);
            }

            20% {
                opacity: 0.8;
                transform: translateY(-30px) rotate(90deg) scale(1);
            }

            50% {
                opacity: 1;
                transform: translateY(-50px) rotate(180deg) scale(1.2);
            }

            80% {
                opacity: 0.6;
                transform: translateY(-30px) rotate(270deg) scale(0.8);
            }

            100% {
                opacity: 0;
                transform: translateY(0px) rotate(360deg) scale(0.3);
            }
        }

        @keyframes slideInFromLeft {
            0% {
                opacity: 0;
                transform: translateX(-50px);
            }

            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInFromRight {
            0% {
                opacity: 0;
                transform: translateX(50px);
            }

            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
